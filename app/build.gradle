apply plugin: 'com.android.application'

android {
    namespace "ee.yutani.kotoba"

    defaultConfig {
        applicationId "ee.yutani.kotoba"
        compileSdk 34
        minSdkVersion 19
        targetSdkVersion 34
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
